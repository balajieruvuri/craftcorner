<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Craft Corner - Like Meeshow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        header { background: #ff6b6b; color: white; padding: 20px; text-align: center; }
        nav { display: flex; justify-content: space-around; padding: 10px; background: #fff; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .product { border: 1px solid #ddd; padding: 10px; background: white; text-align: center; }
        .product img { width: 100%; height: 200px; object-fit: cover; }
        .filters { padding: 10px; background: #eee; }
        .login-form { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 1px solid #ddd; }
        .admin-panel { display: none; background: #fff; padding: 20px; }
        button { background: #ff6b6b; color: white; border: none; padding: 10px; cursor: pointer; }
        input { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <header>
        <h1>My Craft Corner</h1>
        <p>Handmade Crafts for Everyone</p>
    </header>
    <nav>
        <button onclick="showLogin()">User Login</button>
        <button onclick="showAdmin()">Admin Login</button>
        <select id="categoryFilter" onchange="filterProducts()">
            <option value="">All Categories</option>
            <option value="Bags">Bags</option>
            <option value="Accessories">Accessories</option>
            <option value="Decor">Decor</option>
        </select>
        <select id="styleFilter" onchange="filterProducts()">
            <option value="">All Styles</option>
            <option value="Handmade">Handmade</option>
            <option value="Custom">Custom</option>
        </select>
    </nav>
    <div class="filters">
        <input type="text" id="search" placeholder="Search products..." onkeyup="filterProducts()">
    </div>
    <div class="products" id="productList"></div>
    
    <!-- User Login Modal -->
    <div id="loginForm" class="login-form">
        <h2>User Login</h2>
        <input type="tel" id="mobile" placeholder="Enter Mobile Number" required>
        <button onclick="sendOTP()">Send OTP</button>
        <input type="text" id="otp" placeholder="Enter OTP" style="display:none;">
        <button onclick="verifyOTP()" style="display:none;">Verify</button>
        <button onclick="closeLogin()">Close</button>
    </div>
    
    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-panel">
        <h2>Admin Management</h2>
        <input type="password" id="adminPass" placeholder="Admin Password">
        <button onclick="adminLogin()">Login</button>
        <div id="adminContent" style="display:none;">
            <h3>Add Product</h3>
            <input type="text" id="prodName" placeholder="Product Name">
            <input type="text" id="prodCategory" placeholder="Category (e.g., Bags)">
            <input type="text" id="prodStyle" placeholder="Style (e.g., Handmade)">
            <input type="number" id="prodPrice" placeholder="Price">
            <input type="url" id="prodImage" placeholder="Image URL">
            <button onclick="addProduct()">Add Product</button>
            <h3>Manage Products</h3>
            <div id="adminProducts"></div>
        </div>
    </div>

    <script>
        let products = [
            { name: "Tea coaster", category: "Decor", style: "Handmade", price: 15, image: "https://via.placeholder.com/250x200?text=Tote+Bag" },
            { name: "Custom Keychain", category: "Accessories", style: "Custom", price: 5, image: "https://via.placeholder.com/250x200?text=Keychain" },
            { name: "Glowse", category: "Accessories", style: "Handmade", price: 20, image: "https://via.placeholder.com/250x200?text=Pillow" },
            // Add more from your IG page manually
        ];
        let loggedInUser = false;
        let adminLoggedIn = false;

        function displayProducts(list) {
            const container = document.getElementById('productList');
            container.innerHTML = '';
            list.forEach(p => {
                container.innerHTML += `
                    <div class="product">
                        <img src="${p.image}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>Category: ${p.category} | Style: ${p.style}</p>
                        <p>$${p.price}</p>
                        <button onclick="buyProduct('${p.name}')">Buy Now</button>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const cat = document.getElementById('categoryFilter').value;
            const sty = document.getElementById('styleFilter').value;
            const search = document.getElementById('search').value.toLowerCase();
            let filtered = products.filter(p => 
                (!cat || p.category === cat) &&
                (!sty || p.style === sty) &&
                p.name.toLowerCase().includes(search)
            );
            displayProducts(filtered);
        }

        function showLogin() { document.getElementById('loginForm').style.display = 'block'; }
        function closeLogin() { document.getElementById('loginForm').style.display = 'none'; }
        function sendOTP() {
            alert('OTP sent to ' + document.getElementById('mobile').value + ' (Simulated)');
            document.getElementById('otp').style.display = 'block';
            document.querySelector('button[onclick="verifyOTP()"]').style.display = 'block';
        }
        function verifyOTP() {
            if (document.getElementById('otp').value === '1234') { // Simulated OTP
                loggedInUser = true;
                alert('Logged in!');
                closeLogin();
            } else { alert('Invalid OTP'); }
        }

        function showAdmin() { document.getElementById('adminPanel').style.display = 'block'; }
        function adminLogin() {
            if (document.getElementById('adminPass').value === 'admin123') { // Change this password
                adminLoggedIn = true;
                document.getElementById('adminContent').style.display = 'block';
                displayAdminProducts();
            } else { alert('Wrong password'); }
        }
        function addProduct() {
            const name = document.getElementById('prodName').value;
            const cat = document.getElementById('prodCategory').value;
            const sty = document.getElementById('prodStyle').value;
            const price = document.getElementById('prodPrice').value;
            const img = document.getElementById('prodImage').value;
            products.push({ name, category: cat, style: sty, price: parseFloat(price), image: img });
            displayProducts(products);
            displayAdminProducts();
            alert('Product added!');
        }
        function displayAdminProducts() {
            const container = document.getElementById('adminProducts');
            container.innerHTML = '';
            products.forEach((p, i) => {
                container.innerHTML += `<p>${p.name} - <button onclick="deleteProduct(${i})">Delete</button></p>`;
            });
        }
        function deleteProduct(index) {
            products.splice(index, 1);
            displayProducts(products);
            displayAdminProducts();
        }
        function buyProduct(name) {
            if (!loggedInUser) { alert('Please log in first!'); return; }
            alert(`Purchased ${name}! (Simulated)`);
        }

        // Initial load
        displayProducts(products);
    </script>
</body>
</html>
